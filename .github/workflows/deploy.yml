name: Deploy to Hostinger

# Deploys the site to Hostinger via FTPS whenever main changes (which is what
# the admin panel's "Publicar" does), plus a manual "Run workflow" button.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # escenabmx.com is an ADDON domain on this Hostinger account. Its real
          # document root is domains/escenabmx.com/public_html/ — NOT the account's
          # primary public_html/ (which is where the FTP login lands). Uploading to
          # the login root put every file in a folder the domain never serves, so
          # the site kept showing Hostinger's default.php parking page and /index.html
          # 404'd. The FTP account can reach the addon docroot one level up, so we
          # target it explicitly with a path relative to the login directory.
          server-dir: ../domains/escenabmx.com/public_html/
          protocol: ftps
          port: 21
          local-dir: ./
          # only changed files upload after the first run (delta sync)
          #
          # assets/js/sales-log.js and assets/js/audit-log.js are excluded on
          # purpose: they hold real revenue/order data and per-user edit
          # history respectively. This is a public repo, so anything deployed
          # here is publicly fetchable with no auth — admin.html reads/writes
          # both via the GitHub API instead (same trust boundary as
          # publishing), so neither should ever touch the public site.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README*
            **/*.md
            assets/js/sales-log.js
            assets/js/audit-log.js
            tools/**

      - name: Verify the live site is actually serving our files
        # A green FTP upload does NOT prove the site is live: the first deploy
        # uploaded cleanly but to the wrong folder, so the job reported success
        # while escenabmx.com still showed the Hostinger placeholder. This step
        # fetches a real, freshly-deployed page and fails the job if our content
        # isn't being served — so a misconfigured deploy shows red instead of a
        # misleading "success". Cache-busted + retried to ride out CDN/DNS
        # propagation after the upload.
        run: |
          # Clean URL (the .htaccess 301-redirects the old .html form to this);
          # -L follows that redirect so the check validates the final page.
          url="https://escenabmx.com/producto/marco-fitbikeco-str-negro"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            bust="$(date +%s)-$attempt"
            code="$(curl -sL -o /tmp/page.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$url?cb=$bust" || echo 000)"
            if [ "$code" = "200" ] && grep -qi 'pdpMainImg' /tmp/page.html; then
              echo "Live check OK (HTTP $code, product-page markup present) on attempt $attempt."
              ok=1
              break
            fi
            echo "Attempt $attempt: HTTP $code, our content not confirmed yet; retrying in 20s..."
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Upload finished but https://escenabmx.com is NOT serving our files."
            echo "::error::Most likely the FTP server-dir / docroot is wrong (files landed in the wrong folder in Hostinger)."
            exit 1
          fi

      - name: Verify sales-log.js is NOT publicly reachable
        # Regression guard: sales-log.js holds real revenue data and must
        # never be servable from the public site (see the exclude comment
        # above). If this ever starts returning 200 again — e.g. someone
        # removes the exclude rule, or a future refactor re-adds a public
        # <script> load for it — fail the deploy loudly instead of letting
        # a real data leak ship silently.
        run: |
          code="$(curl -sL -o /dev/null -w '%{http_code}' "https://escenabmx.com/assets/js/sales-log.js?cb=$(date +%s)" || echo 000)"
          if [ "$code" = "200" ]; then
            echo "::error::assets/js/sales-log.js is publicly reachable (HTTP 200) — revenue data is exposed. This must stay excluded from the public deploy."
            exit 1
          fi
          echo "OK: sales-log.js is not publicly reachable (HTTP $code)."

      - name: Verify audit-log.js is NOT publicly reachable
        # Same regression guard as sales-log.js, above: audit-log.js holds
        # per-user edit history (admin emails + what they changed) and must
        # never be servable from the public site.
        run: |
          code="$(curl -sL -o /dev/null -w '%{http_code}' "https://escenabmx.com/assets/js/audit-log.js?cb=$(date +%s)" || echo 000)"
          if [ "$code" = "200" ]; then
            echo "::error::assets/js/audit-log.js is publicly reachable (HTTP 200) — admin edit history is exposed. This must stay excluded from the public deploy."
            exit 1
          fi
          echo "OK: audit-log.js is not publicly reachable (HTTP $code)."
